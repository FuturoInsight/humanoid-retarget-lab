[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retarget_lab"
version = "0.1.0"
description = "Humanoid rig & motion retargeting lab: CMU mocap -> MB-Lab character -> generic robot skeleton, with kinematics QA."
requires-python = ">=3.11"
dependencies = [
  "numpy", "scipy", "pandas", "pyarrow", "matplotlib", "pyyaml", "jinja2", "typer",
  "imageio", "imageio-ffmpeg", "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
stretch = ["mediapipe", "opencv-python"]

[project.scripts]
retarget_lab = "retarget_lab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:Gimbal lock detected"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]  # prose lines in docstrings/comments; code is wrapped by `ruff format`
